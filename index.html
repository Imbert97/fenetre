<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultation Météo Interactive Mondiale 🌍</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" crossorigin=""/>
    <!-- CSS personnalisé -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="version-number" style="position: fixed; top: 16px; right: 24px; background: #fffbe7; color: #e17055; font-weight: bold; font-size: 1.1em; border-radius: 7px; padding: 7px 18px; box-shadow: 0 2px 6px rgba(50,50,50,0.05); z-index: 9999;"></div>

    <div class="container">
        <!-- HEADER -->
        <h1>🌍 Consultation Météo Interactive Mondiale</h1>
        
        <!-- ... Autres sections ... -->

        <!-- SECTION INFORMATIONS - Récupération minute, export tableau -->
        <div id="autoFetchContainer" style="margin-top: 24px; max-width: 540px; margin-left:auto; margin-right:auto;">
          <div style="display: flex; gap: 14px; align-items: center; justify-content: flex-start;">
            <button id="startAutoFetch" style="background: linear-gradient(90deg, #0984e3 80%, #00b894); color: white; font-size: 1.05em; font-weight: bold; border: none; border-radius: 7px; padding: 13px 20px; cursor: pointer; box-shadow: 0 2px 12px #0984e314; margin-right: 12px; transition: background 0.18s;">
              <span style="margin-right:6px;">🚀</span>Lancer la récupération
            </button>
            <button id="stopAutoFetch" style="background: linear-gradient(90deg, #d63031 80%, #e17055); color: white; font-size: 1.05em; font-weight: bold; border: none; border-radius: 7px; padding: 13px 20px; cursor: pointer; display: none; box-shadow: 0 2px 12px #d6303114; transition: background 0.2s;">
              <span style="margin-right:6px;">🛑</span>Stopper la récupération
            </button>
            <button id="copyVector" style="background: linear-gradient(90deg, #00b894 80%, #00cec9); color: white; font-size: 1.05em; font-weight: bold; border: none; border-radius: 7px; padding: 13px 20px; cursor: pointer; box-shadow: 0 2px 12px #00b89414; display: none; transition: background 0.2s;">
              <span style="margin-right:6px;">📋</span>Copier le tableau
            </button>
          </div>
          <div id="progressArea" style="margin-top: 22px; display: none;">
            <label for="progressBar" style="font-weight:bold; color:#636e72;">Progression :</label>
            <progress id="progressBar" value="0" max="1" style="width: 94%; height: 18px; border-radius: 10px; overflow: hidden; margin-top: 6px; display: block; background-color: #dfe6e9; accent-color: #00b894;"></progress>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-top:4px;">
              <span id="progressText" style="color:#222;font-size:1.09em;"></span>
            </div>
          </div>
        </div>
        
        <!-- ... Le reste de ton code HTML (infos, footer, etc) ... -->
    </div>
    
    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
